*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{width:100%;height:100%;margin:0}body{background:#70d8ff;font-family:"Yu Gothic",Meiryo,sans-serif;color:#12365b;overflow:hidden}#wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}.top{width:min(100%,1280px);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 8px;font-size:clamp(14px,2vw,20px);font-weight:bold}.pill{background:#fff;border:3px solid #338bd3;border-radius:20px;padding:5px 12px;box-shadow:0 3px #206db0}canvas{width:min(100%,calc((100dvh - 180px)*1.7778));height:auto;max-height:calc(100dvh - 180px);border:5px solid white;border-radius:18px;box-shadow:0 7px 0 #3289c5;background:#93e8ff;touch-action:none}.controls{width:min(100%,1280px);margin-top:12px;text-align:center}.help{font-size:clamp(14px,1.8vw,19px);font-weight:bold;line-height:1.8}kbd{display:inline-block;min-width:32px;padding:2px 7px;border:2px solid #338bd3;border-radius:8px;background:#fff;box-shadow:0 3px #206db0;font:inherit;font-weight:bold}.pickRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.pick{display:flex;align-items:center;gap:8px;border:3px solid #b9d9ef;border-radius:18px;background:#fff;color:#17436b;font-weight:bold;font-size:clamp(15px,2vw,20px);padding:10px 16px;cursor:pointer;box-shadow:0 4px #8fb9d8}.pickIcon{width:52px;height:52px;max-height:none;border:0;border-radius:50%;box-shadow:none;background:#dff5ff;touch-action:none}.pick.selected{border-color:#ffb42c;background:#fff5c9;transform:translateY(-3px);box-shadow:0 7px #da8d19}.pick.pickFocus{outline:5px solid #fff16a;outline-offset:3px;animation:pickBlink .55s steps(2,end) infinite}.start.menuFocused{outline:5px solid #fff16a;outline-offset:4px;animation:startBlink .55s steps(2,end) infinite}@keyframes pickBlink{50%{filter:brightness(1.2);box-shadow:0 7px #da8d19,0 0 22px #fff16a}}@keyframes startBlink{50%{filter:brightness(1.28);box-shadow:0 5px #d46515,0 0 25px #fff16a}}#countdown{z-index:20;background:#10235acc}.countdownNumber{color:#fff;font-size:min(38vw,260px);font-weight:1000;text-shadow:0 8px #167bd1,0 16px #0d3a77;animation:countPop .8s ease-in-out infinite alternate}@keyframes countPop{from{transform:scale(.88)}to{transform:scale(1.08)}}.overlay{position:fixed;inset:0;background:#153b5e99;display:flex;align-items:center;justify-content:center;padding:18px}.introScreen{padding:0;overflow:hidden;background:#53c6f5}.introScreen #titleArt{position:absolute;inset:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.titleContent{position:absolute;z-index:1;top:2%;left:50%;transform:translateX(-50%);width:min(100%,980px);padding:16px 22px;text-align:center;color:#12365b;text-shadow:0 1px #fff;background:linear-gradient(180deg,#ffffffef 0%,#ffffffce 72%,#ffffff00 100%)}.titleContent h1{margin:0 0 6px;color:#0878d2;font-size:clamp(36px,7vw,76px);text-shadow:0 3px #fff}.titleContent p{margin:8px auto 14px;max-width:760px;font-weight:bold;font-size:clamp(15px,2.1vw,22px);line-height:1.5}.defeatArt{display:none;width:160px;height:120px;max-height:none;border:0;border-radius:0;box-shadow:none;background:transparent;margin:0 auto 8px}.defeatArt.show{display:block}.card{background:#fff;border:6px solid #ffca42;border-radius:28px;padding:25px;max-width:620px;text-align:center;box-shadow:0 8px #b9751b}.card h1{margin:0 0 10px;color:#1681dc;font-size:clamp(28px,5vw,44px)}.card p{font-size:18px;line-height:1.7}.start{border:0;border-radius:18px;background:#ff8d28;color:#fff;font-size:22px;font-weight:bold;padding:12px 30px;box-shadow:0 5px #d46515;cursor:pointer}.hide{display:none}@media(max-height:620px) and (orientation:landscape){#wrap{padding:4px}.top{padding:0 6px;gap:5px}.pill{padding:3px 9px}canvas{max-height:calc(100dvh - 150px)}.controls{margin-top:6px}.help{font-size: <body>
<div id="wrap">
  <div class="top">

  </div>

</div>
<div class="overlay introScreen" id="intro"><canvas id="titleArt" aria-hidden="true"></canvas><div class="titleContent"><h1>ソニック走れたい</h1><p id="titleInstructions">← → / マウスでキャラを選ぶ　Spaceで決定</p><div class="pickRow"><button class="pick selected pickFocus" data-pick="0" aria-pressed="true"><canvas class="pickIcon" id="iconSonic" width="80" height="80" aria-hidden="true"></canvas><span>ソニック</span></button><button class="pick" data-pick="1" aria-pressed="false"><canvas class="pickIcon" id="iconTails" width="80" height="80" aria-hidden="true"></canvas><span>テイルス</span></button><button class="pick" data-pick="2" aria-pressed="false"><canvas class="pickIcon" id="iconKnuckles" width="80" height="80" aria-hidden="true"></canvas><span>ナックルズ</span></button></div><button class="start" id="start">スタート</button></div></div>
<div class="overlay hide countdownScreen" id="countdown"><div class="countdownFaces" id="countFaces"><div class="countFace active"><canvas id="countSonic" width="100" height="100" aria-label="ソニック"></canvas></div><div class="countFace"><canvas id="countTails" width="100" height="100" aria-label="テイルス"></canvas></div><div class="countFace"><canvas id="countKnuckles" width="100" height="100" aria-label="ナックルズ"></canvas></div><div class="countFace"><canvas id="countEggman" width="100" height="100" aria-label="エッグマン"></canvas></div></div><div class="countdownNumber" id="countNum">5</div></div><div class="overlay hide" id="end"><div class="card"><canvas class="defeatArt" id="defeatArt" width="160" height="120" aria-hidden="true"></canvas><h1 id="endTitle">やったね！</h1><p id="endText"></p><button class="start menuFocused" id="again">もういちど あそぶ</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),titleCanvas=document.getElementById('titleArt'),titleCtx=titleCanvas.getContext('2d'),W=960,H=540;
let running=false,score=0,lives=3,camera=0,frame=0,activeCharacter=0,selectedCharacter=0,emeraldsFound=0,selectionConfirmed=false;
let spaceHeld=false,spaceGameplay=false,spaceDownFrame=0,jumpQueued=false,facing=1,flightFrames=600,flightActive=false,lastFloatSound=-100,lastAutoPunchFrame=-60,spinDashFrames=0,lastChargeSoundFrame=-30,spinDashUsed=false,activeLoopIndex=-1,loopProgress=0;
let audio=null,countdownTimer=null,countdownActive=false;
const sonicChargeDelay=36;const characterNames=['ソニック','テイルス','ナックルズ'],characterTypes=['sonic','tails','knuckles'];
const player={x:70,y:350,vx:0,vy:0,w:34,h:42,on:false,inv:0};const followerActors={sonic:{x:20,y:350,vx:0,vy:0,on:false,floatFrames:0,phase:0.3},tails:{x:20,y:330,vx:0,vy:0,on:false,floatFrames:0,phase:2.1},knuckles:{x:0,y:310,vx:0,vy:0,on:false,floatFrames:0,phase:4.4}};
const platforms=[{x:0,y:460,w:420,h:100},{x:430,y:420,w:280,h:140},{x:710,y:460,w:350,h:100},{x:1070,y:405,w:270,h:150},{x:1360,y:455,w:430,h:100},{x:1810,y:405,w:300,h:150},{x:2130,y:455,w:460,h:100},{x:2610,y:420,w:490,h:140}];const loops=[{cx:860,baseY:460,radius:78,used:false},{cx:1620,baseY:455,radius:78,used:false}];
const stars=[{x:175,y:410},{x:230,y:410},{x:290,y:410},{x:520,y:370},{x:580,y:370},{x:640,y:370},{x:850,y:410},{x:920,y:410},{x:1210,y:355},{x:1280,y:355},{x:1580,y:405},{x:1660,y:405},{x:1970,y:355},{x:2040,y:355},{x:2370,y:405},{x:2460,y:405},{x:2810,y:370},{x:2890,y:370}].map(s=>({...s,got:false}));
const emeralds=[{x:340,y:400},{x:630,y:355},{x:980,y:395},{x:1300,y:340},{x:1740,y:390},{x:2070,y:340},{x:2500,y:395},{x:2910,y:355}].map(g=>({...g,got:false}));
const enemies=[{type:'robot',x:540,startX:540,y:390,a:480,b:665,v:1.1},{type:'robot',x:1540,startX:1540,y:425,a:1460,b:1770,v:1.3},{type:'robot',x:2300,startX:2300,y:425,a:2240,b:2580,v:1.2},{type:'shimaenaga',x:1190,startX:1190,y:0,baseY:300,amplitude:24,phase:0,a:1100,b:1320,v:1.15},{type:'shimaenaga',x:2180,startX:2180,y:0,baseY:315,amplitude:30,phase:90,a:2110,b:2510,v:1.35}];const boss={x:2910,y:344,hp:3,flash:0,defeated:false};
const punches=[];const goalX=3000;
function prepareAudio(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audio)audio=new A();if(audio.state==='suspended')audio.resume()}catch{}}
function sound(kind,amount=0){if(!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();let from=380,to=620,duration=.13,wave='sine',volume=.11;if(kind==='jump'){from=330;to=700;duration=.16;wave='square';volume=.075}else if(kind==='spin'){from=180;to=980;duration=.38;wave='sawtooth';volume=.08}else if(kind==='charge'){from=220+amount*480;to=from*1.32;duration=.11;wave='sine';volume=.045}else if(kind==='defeat'){from=360;to=85;duration=.72;wave='triangle';volume=.13}else if(kind==='float'){from=540;to=760;duration=.22;wave='triangle';volume=.045}else if(kind==='punch'){from=190;to=75;duration=.16;wave='sawtooth';volume=.1}else if(kind==='collect'){from=760;to=1120;duration=.12;wave='sine';volume=.07}o.type=wave;o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(to,now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration)}function hud(){document.getElementById('score').textContent=`🟡 リング ${score} / 18`;document.getElementById('emeraldCount').textContent=`💎 ${emeraldsFound} / ${emeralds.length}`;document.getElementById('lives').textContent=`💛 ${lives}`;document.getElementById('charLabel').textContent=`🦔 ${characterNames[activeCharacter]}`;document.getElementById('flightLabel').textContent=activeCharacter===1?`🪽 ${Math.ceil(flightFrames/60)}秒`:'🪽 テイルスの力'}
function reset(){score=0;lives=3;emeraldsFound=0;activeCharacter=selectedCharacter;camera=0;frame=0;facing=1;flightFrames=600;flightActive=false;lastFloatSound=-100;lastAutoPunchFrame=frame-60;lastChargeSoundFrame=frame-30;activeLoopIndex=-1;loopProgress=0;loops.forEach(l=>l.used=false);spaceHeld=false;spaceGameplay=false;spaceDownFrame=0;spinDashFrames=0;spinDashUsed=false;jumpQueued=false;player.x=70;player.y=350;player.vx=player.vy=0;player.on=false;player.inv=0;for(let i=0;i<characterTypes.length;i++){const f=followerActors[characterTypes[i]],lag=characterTypes[i]==='tails'?65:characterTypes[i]==='knuckles'?105:40;f.x=Math.max(0,player.x-lag);f.y=player.y-i*12;f.vx=0;f.vy=0;f.on=false;f.floatFrames=0}stars.forEach(s=>s.got=false);emeralds.forEach(g=>g.got=false);enemies.forEach(e=>{e.x=e.startX;e.y=e.baseY??e.y;e.v=Math.abs(e.v);e.defeated=false});boss.hp=3;boss.flash=0;boss.defeated=false;punches.length=0;hud()}
function start(){if(countdownActive)return;prepareAudio();document.getElementById('wrap').classList.add('fullscreenGame');if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});document.getElementById('intro').classList.add('hide');document.getElementById('end').classList.add('hide');reset();draw();running=false;countdownActive=true;const overlay=document.getElementById('countdown'),number=document.getElementById('countNum');let remaining=5;number.textContent=remaining;markCountdownBeat(remaining);overlay.classList.remove('hide');countdownTimer=setInterval(()=>{remaining--;if(remaining>0){number.textContent=remaining;markCountdownBeat(remaining)}else{clearInterval(countdownTimer);countdownTimer=null;countdownActive=false;overlay.classList.add('hide');running=true;requestAnimationFrame(loop)}},1000)}
document.getElementById('start').addEventListener('click',()=>{if(!selectionConfirmed){selectionConfirmed=true;updateMenuSelection()}else start()});document.getElementById('again').addEventListener('click',replayMenu);document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{selectedCharacter=Number(b.dataset.pick);selectionConfirmed=false;updateMenuSelection()}));function updateMenuSelection(){document.querySelectorAll('.pick').forEach((b,i)=>{b.classList.toggle('selected',i===selectedCharacter);b.classList.toggle('pickFocus',i===selectedCharacter&&!selectionConfirmed);b.setAttribute('aria-pressed',i===selectedCharacter?'true':'false')});document.getElementById('start').classList.toggle('menuFocused',selectionConfirmed);document.getElementById('titleInstructions').textContent=selectionConfirmed?`${characterNames[selectedCharacter]}を えらんだよ！ Spaceでスタート`:'← → / マウスでキャラを選ぶ　Spaceで決定'}function replayMenu(){selectedCharacter=activeCharacter;selectionConfirmed=false;document.getElementById('end').classList.add('hide');document.getElementById('defeatArt').classList.remove('show');document.getElementById('intro').classList.remove('hide');updateMenuSelection();requestAnimationFrame(drawTitleScene)}updateMenuSelection();function switchCharacter(){const oldType=characterTypes[activeCharacter],oldState=followerActors[oldType];Object.assign(oldState,{x:player.x,y:player.y,vx:player.vx,vy:player.vy,on:player.on});activeCharacter=(activeCharacter+1)%characterTypes.length;const next=followerActors[characterTypes[activeCharacter]];player.x=next.x;player.y=next.y;player.vx=1.9;player.vy=next.vy;player.on=next.on;spinDashFrames=0;spinDashUsed=false;jumpQueued=false;if(spaceHeld)spaceDownFrame=frame;hud();if(activeCharacter===2&&spaceHeld)lastAutoPunchFrame=frame-60}
function advanceMenu(){if(countdownActive)return;if(!document.getElementById('end').classList.contains('hide')){replayMenu();return}if(!document.getElementById('intro').classList.contains('hide')){if(!selectionConfirmed){selectionConfirmed=true;updateMenuSelection()}else start()}}function beginGameplayAction(){if(!running||spaceHeld)return;prepareAudio();spaceHeld=true;spaceGameplay=true;spaceDownFrame=frame;spinDashUsed=false;if(activeCharacter!==0)jumpQueued=true;if(activeCharacter===2)lastAutoPunchFrame=frame-60}function endGameplayAction(){if(spaceGameplay&&activeCharacter===0&&spinDashFrames===0&&!spinDashUsed&&frame-spaceDownFrame<sonicChargeDelay)jumpQueued=true;spaceHeld=false;spaceGameplay=false;spinDashUsed=false}document.getElementById('touchAction').addEventListener('pointerdown',e=>{e.preventDefault();if(!running)return;document.getElementById('touchAction').classList.add('pressed');try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}beginGameplayAction()});for(const eventName of ['pointerup','pointercancel','lostpointercapture'])document.getElementById('touchAction').addEventListener(eventName,e=>{e.preventDefault();document.getElementById('touchAction').classList.remove('pressed');endGameplayAction()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.getElementById('touchAction').addEventListener('contextmenu',e=>e.preventDefault());document.getElementById('touchSwitch').addEventListener('click',()=>{if(running)switchCharacter()});window.addEventListener('keydown',e=>{if(e.code==='Space'){if(!running){e.preventDefault();if(e.repeat)return;advanceMenu();return}e.preventDefault();if(!e.repeat)beginGameplayAction();return}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(!running&&!document.getElementById('intro').classList.contains('hide')){e.preventDefault();if(e.repeat)return;const direction=e.key==='ArrowRight'?1:-1;selectedCharacter=(selectedCharacter+direction+characterTypes.length)%characterTypes.length;selectionConfirmed=false;updateMenuSelection()}return}if(e.key==='ArrowDown'){e.preventDefault();if(e.repeat)return;if(running)switchCharacter()}});
window.addEventListener('keyup',e=>{if(e.code==='Space')endGameplayAction()});window.addEventListener('blur',()=>{spaceHeld=false;spaceGameplay=false});
function firePunch(){const positions=partyPositions(),hero=positions[0];punches.push({x:hero.x+facing*22,y:hero.y,vx:facing*9,life:70});sound('punch')}
function orbitPoint(loop,progress){const angle=Math.PI/2-Math.PI*2*progress,cx=loop.cx+loop.radius*Math.cos(angle),cy=loop.baseY-player.h/2-loop.radius+loop.radius*Math.sin(angle);return {x:cx,y:cy,tilt:-Math.PI*2*progress}}
function touchesLoop(loop){const px=player.x+player.w/2,py=player.y+player.h/2,cy=loop.baseY-loop.radius;return Math.abs(Math.hypot(px-loop.cx,py-cy)-loop.radius)<=player.h/2+11}
