<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#b9edff;color:#304461;font-family:Meiryo,"Yu Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.game{position:relative;width:min(100vw,1100px);height:100vh;height:100dvh;min-height:520px;margin:auto;background:#8cdbff;overflow:hidden;border:5px solid white;border-radius:20px;box-shadow:0 10px 32px #456b8050}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;gap:8px}.pill{background:#fffc;border:3px solid white;border-radius:16px;padding:8px 13px;font-weight:900;font-size:clamp(14px,2.4vw,21px);box-shadow:0 4px #50779844}.controls{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.group{display:flex;gap:10px}.control{pointer-events:auto;border:4px solid white;border-radius:22px;min-width:72px;min-height:72px;padding:8px 13px;-webkit-appearance:none;background:#ffffffdd;color:#304461;font:bold 26px Meiryo,sans-serif;box-shadow:0 6px #50779855;touch-action:none}.control:active,.control.down{transform:translateY(4px);box-shadow:0 2px #50779855}.jump{background:#ffd35b;min-width:116px;font-size:21px}.overlay{position:absolute;inset:0;z-index:5;background:#264d6988;display:grid;place-items:center;padding:14px}.card{background:#fff9e9;border:7px solid white;border-radius:28px;padding:20px;text-align:center;width:min(700px,96%);box-shadow:0 10px #325a7277}.card h1{margin:0;color:#ed785f;font-size:clamp(24px,5vw,42px)}.card p{font-size:clamp(15px,2.5vw,19px);font-weight:bold}.choices{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px}.choice{border:4px solid white;border-radius:16px;padding:8px 10px;background:#fff;font-weight:bold;color:#345;box-shadow:0 4px #9995}.ch  fill="#a92f45" stroke="#772c3a" stroke-width="5"/><g id="kingCharacter"><path d="M718 137Q719 119 733 115H767Q782 120 783 138L775 155H726Z" fill="#b63248" stroke="#6f293a" stroke-width="4"/><path d="M728 126L710 137L720 145M772 126L790 137L780 145" fill="none" stroke="#b63248" stroke-width="10" stroke-linecap="round"/><ellipse cx="711" cy="138" rx="8" ry="7" fill="#f3bd86" stroke="#9a6444" stroke-width="2"/><ellipse cx="789" cy="138" rx="8" ry="7" fill="#f3bd86" stroke="#9a6444" stroke-width="2"/><path d="M733 153L733 163L749 163L749 153M752 153L752 163L768 163L768 153" fill="#323e66"/><path d="M730 162H750V169H727ZM751 162H771V169H750Z" fill="#594054"/><path d="M730 114Q735 104 750 104Q765 104 770 114" fill="#edc44d" stroke="#a67b2c" stroke-width="3"/><ellipse cx="750" cy="88" rx="23" ry="25" fill="#f3bd86" stroke="#9a6444" stroke-width="3"/><path d="M727 84Q726 62 750 59Q775 62 773 85L766 78L759 82L750 76L740 82L734 78Z" fill="#817064"/><path d="M731 77L728 58L741 68L750 48L759 68L773 57L770 81Z" fill="#ffcf38" stroke="#a66f20" stroke-width="3"/><circle cx="750" cy="62" r="4" fill="#d94b58"/><circle cx="740" cy="73" r="3" fill="#4aaed0"/><circle cx="760" cy="73" r="3" fill="#4aaed0"/><g id="kingBrows" fill="none" stroke="#684638" stroke-width="3" stroke-linecap="round"><path id="kingBrowLeft" d="M737 83Q742 80 747 83"/><path id="kingBrowRight" d="M754 83Q759 80 764 83"/></g><ellipse cx="742" cy="89" rx="2.5" ry="3.5" fill="#26364b"/><ellipse cx="759" cy="89" rx="2.5" ry="3.5" fill="#26364b"/><path d="M750 89L747 98L752 99" fill="none" stroke="#a36c4b" stroke-width="2"/><path d="M733 98Q740 104 749 100Q758 104 767 98Q766 112 750 114Q735 112 733 98Z" fill="#f6f0e4" stroke="#a69a87" stroke-width="2"/><path d="M739 96Q744 92 750 96Q756 92 761 96" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path id="kingMouth" d="M744 106Q750 111 757 106" fill="none" stroke="#8a5141" stroke-width="2.5"/><path d="M716 139L712 88M707 88H717M709 82L712 74L716 82" <style>
.castle{position:absolute;inset:0;z-index:10;background:#243d68cc;display:grid;place-items:center;padding:14px}.castle.hidden{display:none!important}.castlecard{width:min(920px,98%);background:#fff7df;border:7px solid #fff;border-radius:28px;padding:clamp(12px,2vw,22px);text-align:center;box-shadow:0 10px #213b5e88}.castlecard h2{margin:0;color:#c05c4a;font-size:clamp(24px,4vw,38px)}.castlecard p{margin:8px;font-weight:900;font-size:clamp(15px,2.4vw,21px)}.hall{position:relative;width:100%;height:clamp(220px,46vh,390px);overflow:hidden;border:5px solid white;border-radius:22px;background:linear-gradient(#9edfff 0 65%,#f5d496 65%)}.hall svg{width:100%;height:100%;display:block}.climber{position:absolute;left:12%;bottom:12%;width:clamp(105px,16vw,155px);height:clamp(125px,24vh,175px);transition:left .5s,bottom .5s;filter:drop-shadow(0 3px 3px #3655)}.climber canvas{width:100%;height:100%;display:block}.castlebuttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}.castlebtn{border:0;border-radius:18px;padding:12px 18px;background:#91dcf2;color:#34445b;font:bold clamp(16px,2.4vw,21px) Meiryo;box-shadow:0 5px #619ab0}.castlebtn:disabled{opacity:.48}#kingAngerMarks{display:none}#kingCharacter.angry #kingAngerMarks{display:block}.castlebtn.meet{background:#ffd25a}.castlebtn.again{background:#a5df79}

<script>
const COLORS=[["あか","#f36e75"],["みずいろ","#69c8e8"],["きいろ","#ffd45b"],["ピンク","#f48ab1"],["オレンジ","#ff9956"],["みどり","#77c967"]];
let chosen=0,run=false,done=false,world=0,stars=0,mud=0,toastTimer=0,washing=false,cleanTool="",washCompleted=false,inCastle=false,castleStep=0,gameCleared=false;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),game=document.getElementById('game'),keys={left:false,right:false,jump:false};
const player={x:100,y:0,vx:0,vy:0,w:48,h:56,ground:false,face:1};
let platforms=[],items=[],puddles=[],friends=[];
function build(){
 platforms=[{x:0,y:0,w:5800,h:100}];
 // y is defined relative to the ground surface (base ground is at 0)
 platforms.push({x:330,y:-95,w:150,h:18},{x:770,y:-145,w:180,h:18},{x:1240,y:-95,w:155,h:18},{x:2050,y:-120,w:180,h:18},{x:2780,y:-100,w:180,h:18},{x:3500,y:-145,w:200,h:18});
 items=[260,390,530,700,850,1010,1160,1320,1510,1720,2020,2180,2380,2700,2870,3100,3470,3650,3830,4020,4230].map((x,i)=>({x,y:(i%4===2?-135:-48),got:false}));
 puddles=[{x:610,w:95},{x:1080,w:110},{x:1810,w:120},{x:2440,w:110},{x:3220,w:125}];
 friends=[];
}
function setupFriends(){const other=COLORS.map((_,i)=>i).filter(i=>i!==chosen);friends=other.map((c,i)=>({c,angle:(Math.PI*2*i)/other.length,radius:92+(i%2)*20,speed:.008+(i%2)*.002}))}
function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();build();
const choices=document.getElementById('choices');COLORS.forEach(([n,c],i)=>{let b=document.createElement('button');b.className='choice'+(!i?' sel':'');b.innerHTML='<span class="dot" style="background:'+c+'"></span>'+n;b.onclick=()=>{chosen=i;document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('sel',i===j))};choices.append(b)});
function say(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
function groundY(x){return H-155}
let W=900,H=600,cam=0;
function drawRody(x,y,color,scale=1,rider=false,dirty=false,face=1,target=ctx){
 const g=target;g.save();g.translate(x,y);g.scale(scale*(face<0?-1:1),scale);g.lineJoin='round';g.lineCap='round';
 const outline='#a95e31';g.lineWidth=3.2;g.fillStyle=color;g.strokeStyle=outline;
 // One continuous silhouette: long gourd-shaped body, raised neck, head and four little feet.
 g.beginPath();g.moveTo(-40,5);
 g.quadraticCurveTo(-50,11,-46,20);g.quadraticCurveTo(-44,29,-29,29);g.lineTo(-25,19);
 g.quadraticCurveTo(-21,18,-16,19);g.lineTo(-15,26);g.quadraticCurveTo(-12,32,0,30);g.lineTo(4,18);
 g.quadraticCurveTo(12,20,19,18);g.lineTo(20,27);g.quadraticCurveTo(24,33,36,30);g.lineTo(40,18);
 g.quadraticCurveTo(45,16,48,14);g.lineTo(48,22);g.quadraticCurveTo(52,30,63,25);g.quadraticCurveTo(70,20,61,12);
 g.quadraticCurveTo(58,8,49,3);g.bezierCurveTo(68,-8,65,-23,52,-30);
 g.bezierCurveTo(61,-42,63,-56,57,-68);g.bezierCurveTo(51,-80,39,-85,28,-80);
 g.bezierCurveTo(16,-75,15,-63,19,-53);g.bezierCurveTo(23,-43,18,-36,7,-31);
 g.bezierCurveTo(-7,-29,-21,-35,-32,-24);g.bezierCurveTo(-46,-15,-51,-3,-40,5);
 g.closePath();g.fill();g.stroke();
 // Soft molded ears and a little tail bump remain part of the same pony silhouette style.
 g.fillStyle='rgba(255,255,255,.42)';g.beginPath();g.ellipse(-19,-14,10,3,-.55,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(37,-45,8,3,-.8,0,Math.PI*2);g.fill();
 g.strokeStyle=outline;g.lineWidth=2.2;g.fillStyle=color;
 g.beginPath();g.moveTo(27,-77);g.quadraticCurveTo(18,-95,27,-104);g.quadraticCurveTo(42,-95,38,-76);g.closePath();g.fill();g.stroke();
 g.beginPath();g.moveTo(44,-75);g.quadraticCurveTo(49,-91,61,-91);g.quadraticCurveTo(68,-78,54,-69);g.closePath();g.fill();g.stroke();
 g.fillStyle='#ffc5ce';g.beginPath();g.ellipse(29,-91,3,8,-.1,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(58,-82,3,6,.45,0,Math.PI*2);g.fill();
 // Saddle, characteristic orange spots, and face details.
 g.fillStyle='#d94c55';g.beginPath();g.moveTo(-15,-24);g.quadraticCurveTo(0,-32,20,-24);g.quadraticCurveTo(11,-15,-5,-16);g.closePath();g.fill();g.strokeStyle=outline;g.lineWidth=1.6;g.stroke();
 g.fillStyle='#f28b45';[[-30,-1,4],[-21,13,3],[-3,-2,3.5],[24,1,4],[14,14,3]].forEach(([sx,sy,sr])=>{g.beginPath();g.arc(sx,sy,sr,0,Math.PI*2);g.fill()});
 g.fillStyle='white';g.beginPath();g.ellipse(47,-57,7,8,.1,0,Math.PI*2);g.fill();g.strokeStyle='#8c6149';g.lineWidth=1.4;g.stroke();g.fillStyle='#243747';g.beginPath();g.arc(49,-57,3.5,0,Math.PI*2);g.fill();g.fillStyle='#7e4631';g.beginPath();g.ellipse(67,-39,1.6,2.4,0,0,7);g.fill();g.strokeStyle=outline;g.lineWidth=1.5;g.beginPath();g.arc(58,-30,5,.2,1.6);g.stroke();
 g.fillStyle='#db7543';g.font='bold 7px serif';g.textAlign='center';g.fillText('Rody',0,4);
 if(dirty){g.fillStyle='#78502f';[[-29,-10],[-13,15],[7,-6],[25,9]].forEach(([dx,dy])=>{g.beginPath();g.ellipse(dx,dy,4,3,0,0,7);g.fill()})}
 // The child sits astride the same pony, legs draped over its sides.
 if(rider){g.strokeStyle='#344b72';g.lineWidth=7;g.beginPath();g.moveTo(-4,-30);g.quadraticCurveTo(-17,-20,-19,-9);g.moveTo(7,-30);g.quadraticCurveTo(18,-20,22,-8);g.stroke();g.fillStyle='#ffcf94';g.beginPath();g.ellipse(-20,-8,6,4,-.2,0,7);g.ellipse(23,-7,6,4,.2,0,7);g.fill();g.fillStyle='#4a9bd3';g.beginPath();g.roundRect(-9,-43,19,18,6);g.fill();g.strokeStyle='#ffcf94';g.lineWidth=4;g.beginPath();g.moveTo(-8,-40);g.lineTo(-17,-29);g.moveTo(8,-40);g.lineTo(17,-29);g.stroke();g.fillStyle='#ffcf94';g.beginPath();g.arc(0,-54,8.5,0,7);g.fill();g.fillStyle='#68432f';g.beginPath();g.arc(0,-57,8.5,Math.PI,Math.PI*2);g.lineTo(8,-54);g.quadraticCurveTo(0,-60,-8,-54);g.closePath();g.fill()}
 g.restore()
}
function renderAuxRody(id,dirty=false){const c=document.getElementById(id);if(!c)return;const w=c.clientWidth||180,h=c.clientHeight||180,d=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*d);c.height=Math.round(h*d);const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);drawRody(w/2,h-22,COLORS[chosen][1],Math.min(w/128,h/128,1.2),true,dirty,1,g)}function drawCastleExterior(x){ctx.fillStyle='#f7d886';ctx.fillRect(x,H-300,245,175);ctx.fillStyle='#c85e55';ctx.beginPath();ctx.moveTo(x-20,H-300);ctx.lineTo(x+122,H-390);ctx.lineTo(x+265,H-300);ctx.closePath();ctx.fill();ctx.fillStyle='#fff0b6';ctx.fillRect(x+22,H-275,42,53);ctx.fillRect(x+181,H-275,42,53);ctx.fillStyle='#ad6445';ctx.fillRect(x+91,H-218,63,93);ctx.fillStyle='#5687b7';ctx.beginPath();ctx.arc(x+122,H-345,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7d8';ctx.font='bold 18px Meiryo';ctx.textAlign='center';ctx.fillText('ロディー王国',x+122,H-397);ctx.textAlign='start'}function draw(){
 let r=game.getBoundingClientRect();W=r.width;H=r.height;ctx.clearRect(0,0,W,H);
 // far hills and clouds
 ctx.fillStyle='#d9f6ff';for(let i=0;i<6;i++){let x=((i*210-cam*.18)%(W+220)+W+220)%(W+220)-60;ctx.beginPath();ctx.arc(x,145,44,0,7);ctx.arc(x+42,153,34,0,7);ctx.fill()}
